# ==========================================
# CONFIGURACIÓN GENERAL Y ARRANQUE RÁPIDO
# ==========================================
# Carga diferida: solo levanta en memoria lo que se necesita en el momento
spring.main.lazy-initialization=true
spring.main.banner-mode=off

# ==========================================
# CONFIGURACIÓN DE LA BASE DE DATOS
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Pool HikariCP: evita bloquear el inicio abriendo conexiones en exceso
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=20000

# Hibernate: 'none' evita inspeccionar tablas remotas en cada cold start
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# CONFIGURACIÓN DE CORREO (JavaMailSender)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true